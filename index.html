<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Управління замовленнями клієнтів</title>
</head>
<body>
    <header class="main-header">
        <div class="header-left">
            <div class="logo">
                <h1>TechSupply<span>Pro</span></h1>
            </div>
            <div id="datetime-container" class="datetime"></div>
        </div>
        
        <div class="user-profile" id="profile-icon-btn" data-target="profile-section" title="Профіль користувача" style="cursor: pointer;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
    </header>

    <nav class="main-nav">
        <ul id="nav-menu">
            <li><button data-target="catalog-section" class="nav-btn active">Каталог товарів</button></li>
            <li><button data-target="cart-section" class="nav-btn">Кошик</button></li>
            <li><button data-target="about-section" class="nav-btn">Про систему</button></li>
        </ul>
    </nav>

    <main class="content-area">
        <section id="catalog-section" class="page-section active">
            <h2>Каталог корпоративного обладнання</h2>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Пошук товарів...">
            </div>
            <div id="products-container" class="grid-container"></div>
        </section>

        <section id="cart-section" class="page-section">
            <h2>Кошик</h2>
            <div id="cart-content">
                <p>Тут з'являться обрані товари.</p>
            </div>

            <div id="cart-total" class="cart-total" style="display: none;">
                Загальна сума: <span>0 ₴</span>
            </div>

            <div class="checkout-wrapper">
                <h3>Оформлення замовлення</h3>
                <form id="checkout-form" class="standard-form">
                    <div class="form-group">
                        <label for="client-name">Ім'я та Прізвище *</label>
                        <input type="text" id="client-name" name="name" placeholder="Наприклад: Іван Іваненко">
                    </div>
                    
                    <div class="form-group">
                        <label for="client-phone">Телефон *</label>
                        <input type="tel" id="client-phone" name="phone" placeholder="+380XXXXXXXXX">
                        <small class="error-msg" id="phone-error"></small> 
                    </div>
                    
                    <div class="form-group">
                        <label for="client-email">Email *</label>
                        <input type="email" id="client-email" name="email" placeholder="email@company.com">
                    </div>
                    
                    <button type="submit" class="submit-btn">Підтвердити замовлення</button>
                    <div id="form-message" class="form-message"></div>
                </form>
            </div>
        </section>

        <section id="profile-section" class="page-section">
            <h2>Особистий кабінет</h2>
            
            <div id="login-wrapper" class="checkout-wrapper">
                <h3>Вхід у систему</h3>
                <form id="login-form" class="standard-form">
                    <div class="form-group">
                        <label for="login-email">Ваш Email</label>
                        <input type="email" id="login-email" required placeholder="email@company.com">
                    </div>
                    <div class="form-group">
                        <label for="login-name">Ваше Ім'я</label>
                        <input type="text" id="login-name" required placeholder="Іван Іваненко">
                    </div>
                    <button type="submit" class="submit-btn">Увійти</button>
                </form>
            </div>

            <div id="user-dashboard" style="display: none;">
                <div class="user-info-card" style="background: #f1f5f9; padding: 1rem; border-radius: 8px; margin-bottom: 2rem;">
                    <h3 id="display-user-name" style="color: var(--primary-color);"></h3>
                    <p id="display-user-email" style="color: #64748b;"></p>
                    <button id="logout-btn" class="remove-btn" style="margin-top: 1rem;">Вийти з акаунту</button>
                </div>
                
                <h3>Історія ваших замовлень</h3>
                <div id="order-history-container"></div>
            </div>
        </section>

        <section id="about-section" class="page-section">
            <h2>Інформація про систему</h2>
            <div id="system-info" class="info-card">
                </div>
        </section>

    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Система управління замовленнями клієнтів. Всі права захищено.</p>
        <div id="footer-navigator-info" class="micro-text"></div>
    </footer>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" title="Закрити вікно">&times;</span>
            <div id="modal-details"></div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
